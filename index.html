<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SlowFrame</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="stage">
    <img class="slide" id="slide-a" alt="" referrerpolicy="no-referrer" decoding="async">
    <img class="slide" id="slide-b" alt="" referrerpolicy="no-referrer" decoding="async">
    <div id="transition-overlay"></div>
    <div id="pause-icon">&#10074;&#10074;</div>
    <!-- Faded vote controls, top-right (the gear follows the pointer, the
         pause icon owns bottom-right, the diagnostic overlay top-left). -->
    <div id="vote-bar" hidden>
      <button type="button" class="vote-btn" id="vote-up" aria-label="Keep this image">&#128077;</button>
      <button type="button" class="vote-btn" id="vote-down" aria-label="Never show this image again">&#128078;</button>
    </div>
    <button id="settings-gear" class="icon-btn" aria-label="Settings" hidden>&#9881;</button>
  </div>
  <div id="footer">
    <div id="title"></div>
    <div id="meta"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
